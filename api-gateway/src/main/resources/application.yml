server:
  port: 8080

spring:
  application:
    name: api-gateway
  
  cloud:
    gateway:
      routes:
        # Route 1: /api/convert/** → measurement-service
        - id: measurement-route
          uri: lb://measurement-service
          predicates:
            - Path=/api/convert/**
          filters:
            - StripPrefix=0

        # Route 2: /api/measurements/** → measurement-service
        - id: measurement-history-route
          uri: lb://measurement-service
          predicates:
            - Path=/api/measurements/**
          filters:
            - StripPrefix=0

        # Route 3: /api/users/** → user-service
        - id: user-route
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=0

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    com.apps.gateway: DEBUG
